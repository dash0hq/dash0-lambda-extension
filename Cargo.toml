[package]
name = "aws-lambda-runtime-api-proxy-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.18.0"
parking_lot = "0.12.1"
tokio = { version = "1.29.1", features = ["full"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
hyper-rustls = { version = "0.27", features = ["http1", "native-tokio", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
matchit = "0.7"
opentelemetry-proto = { version = "0.31", features = ["trace", "logs", "metrics", "with-serde", "gen-tonic"] }
tonic = "0.14"
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
hex = "0.4.3"
base64 = "0.22"
regex = "1.12.2"
hmac = "0.12"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3.0"
