[build]
# Force cross to use Docker images for cross-compilation
# This prevents it from trying to install native Linux toolchains on macOS
# Use edge images with newer GLIBC to avoid version mismatches

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:edge"
pre-build = [
    "dpkg --add-architecture amd64",
]

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:edge"
pre-build = [
    "dpkg --add-architecture arm64",
]
