plugins {
  id "java"
  // MaskingCanary, for the instrumentation tests
  id "java-test-fixtures"
}

dependencies {
  compileOnly(project(":bootstrap"))
  compileOnly("io.opentelemetry:opentelemetry-exporter-otlp-common")
  compileOnly("io.opentelemetry.semconv:opentelemetry-semconv:${versions.opentelemetrySemconv}")
  compileOnly("io.opentelemetry.semconv:opentelemetry-semconv-incubating:${versions.opentelemetrySemconvIncubating}")
  compileOnly("io.opentelemetry:opentelemetry-sdk")
  compileOnly("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi")
  compileOnly("io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api")
  compileOnly("io.opentelemetry.javaagent:opentelemetry-javaagent-tooling")
  compileOnly("com.fasterxml.jackson.core:jackson-core:${versions.jackson}")

  implementation(project(":utils"))

  implementation("io.opentelemetry.contrib:opentelemetry-samplers:${versions.opentelemetryContrib}") {
    exclude group: "io.opentelemetry", module: "opentelemetry-sdk"
    exclude group: "io.opentelemetry", module: "opentelemetry-api"
    exclude group: "io.opentelemetry", module: "opentelemetry-semconv"
    exclude group: "io.opentelemetry", module: "opentelemetry-sdk-extension-autoconfigure"
  }

  annotationProcessor deps.autoservice
  compileOnly deps.autoservice

  testImplementation(project(":test-utils"))
  testImplementation(project(":bootstrap"))
  testImplementation("io.opentelemetry:opentelemetry-sdk")
  testImplementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi")
  testImplementation("io.opentelemetry.semconv:opentelemetry-semconv:${versions.opentelemetrySemconv}")
  testImplementation("io.opentelemetry.semconv:opentelemetry-semconv-incubating:${versions.opentelemetrySemconvIncubating}")
  testImplementation("org.hamcrest:hamcrest:${versions.hamcrest}")
  testImplementation("org.mockito:mockito-core:${versions.mockito}")
  testImplementation("com.fasterxml.jackson.core:jackson-databind:${versions.jackson}")
  testImplementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure")

  // The agent provides these at runtime; an instrumentation test that uses MaskingCanary needs them
  // on its own classpath.
  testFixturesApi(platform("io.opentelemetry:opentelemetry-bom:${versions.opentelemetrySdk}"))
  testFixturesApi("io.opentelemetry:opentelemetry-sdk")
  testFixturesImplementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure")
  testFixturesImplementation("io.opentelemetry.semconv:opentelemetry-semconv:${versions.opentelemetrySemconv}")
  testFixturesImplementation("io.opentelemetry.semconv:opentelemetry-semconv-incubating:${versions.opentelemetrySemconvIncubating}")
  testFixturesImplementation("com.fasterxml.jackson.core:jackson-core:${versions.jackson}")
}

// Prints what masking costs per span; see MaskingBenchmark.
tasks.register("maskingBenchmark", JavaExec) {
  classpath = sourceSets.test.runtimeClasspath
  mainClass = "io.dash0.javaagent.masking.MaskingBenchmark"
}
