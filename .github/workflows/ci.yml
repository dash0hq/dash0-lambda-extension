name: CI

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  CARGO_TERM_COLOR: always
  RESOURCE_PREFIX: pr-${{ github.event.pull_request.number }}-

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  python-distro-test:
    name: Python Distro Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv opt/python/distro/.venv
          opt/python/distro/.venv/bin/pip install -r opt/python/distro/requirements-dev.txt
      - name: Run tests
        working-directory: opt/python/distro
        run: .venv/bin/pytest

  node-distro-test:
    name: Node Distro Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build @opentelemetry/instrumentation-aws-sdk from fork
        run: bash opt/node/scripts/build-aws-sdk-tarball.sh
      - name: Install dependencies
        working-directory: opt/node
        run: npm install
      - name: Run tests
        working-directory: opt/node
        run: npm test

  build:
    name: Build Rust Binaries
    uses: ./.github/workflows/build.yml

  deploy:
    name: Publish Layers
    needs: build
    uses: ./.github/workflows/publish.yml
    with:
      environment: staging
      prefix: pr-${{ github.event.pull_request.number }}-
    secrets: inherit

  integration-test:
    name: Integration Test
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            integration-tests/iac/package-lock.json
            integration-tests/tests/package-lock.json
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install dependencies
        working-directory: integration-tests/iac
        run: npm ci
      - name: Deploy CDK stack
        working-directory: integration-tests/iac
        run: npm run deploy
        env:
          DASH0_DEV_API_TOKEN: ${{ secrets.DASH0_DEV_API_TOKEN }}
          RESOURCE_PREFIX: ${{ env.RESOURCE_PREFIX }}
      - name: Install test dependencies
        working-directory: integration-tests/tests
        run: npm ci
      - name: Run integration tests
        working-directory: integration-tests/tests
        run: npm run test
        env:
          DASH0_DEV_API_TOKEN: ${{ secrets.DASH0_DEV_API_TOKEN }}
          RESOURCE_PREFIX: ${{ env.RESOURCE_PREFIX }}
