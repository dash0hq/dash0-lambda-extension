name: Publish Layers

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      prefix:
        required: false
        type: string
        default: ''
      region:
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    # Disabled: the backfill races eu-west-1's parallel deploy and drifts version
    # counters (notably the fast, Docker-less manual layer). Re-enable only once
    # it aligns to a pre-deploy snapshot instead of reading eu-west-1 live.
    if: false
    name: Backfill layer versions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - name: Backfill layer version counters
        env:
          REGION: ${{ inputs.region }}
        run: tools/backfill-layer-versions.sh eu-west-1 "$REGION"

  deploy-python:
    name: Build and Publish Python
    needs: backfill
    # Run when backfill succeeded or was skipped (dev, eu-west-1), but not when it failed.
    if: ${{ !cancelled() && (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Python layer and Docker image
        run: make python docker-python LAYER_NAME_PREFIX="$LAYER_PREFIX" ECR_REPO_PREFIX="$LAYER_PREFIX"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}

  deploy-node:
    name: Build and Publish Node.js
    needs: backfill
    if: ${{ !cancelled() && (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Node.js layer and Docker image
        run: make node docker-node LAYER_NAME_PREFIX="$LAYER_PREFIX" ECR_REPO_PREFIX="$LAYER_PREFIX"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}

  deploy-java:
    name: Build and Publish Java
    needs: backfill
    if: ${{ !cancelled() && (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Java layer and Docker image
        run: make java docker-java LAYER_NAME_PREFIX="$LAYER_PREFIX" ECR_REPO_PREFIX="$LAYER_PREFIX"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}

  deploy-manual:
    name: Build and Publish Manual
    needs: backfill
    if: ${{ !cancelled() && (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Build and publish Manual layer
        run: make manual LAYER_NAME_PREFIX="$LAYER_PREFIX"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}
