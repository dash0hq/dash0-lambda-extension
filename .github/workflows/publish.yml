name: Publish Layers

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      prefix:
        required: false
        type: string
        default: ''
      region:
        required: false
        type: string
        default: ''
      # Private, regional images. PR builds need them for the dockerized
      # integration tests; deploys publish public images once through
      # publish-images.yml and turn this off.
      publish_images:
        required: false
        type: boolean
        default: true
      # Layer version to publish: `auto` for whatever version AWS assigns next,
      # or a number that every layer must get. See tools/layers/src/publish.ts.
      version:
        required: false
        type: string
        default: auto

permissions:
  id-token: write
  contents: read

jobs:
  deploy-python:
    name: Build and Publish Python
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      # For tools/layers, which publishes the layer.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        if: inputs.publish_images
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: inputs.publish_images
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Python layer and Docker image
        run: make python $DOCKER_TARGET LAYER_NAME_PREFIX="$LAYER_PREFIX" ECR_REPO_PREFIX="$LAYER_PREFIX" LAYER_VERSION="$LAYER_VERSION"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}
          LAYER_VERSION: ${{ inputs.version }}
          DOCKER_TARGET: ${{ inputs.publish_images && 'docker-python' || '' }}

  deploy-node:
    name: Build and Publish Node.js
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        if: inputs.publish_images
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: inputs.publish_images
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Node.js layer and Docker image
        run: make node $DOCKER_TARGET LAYER_NAME_PREFIX="$LAYER_PREFIX" ECR_REPO_PREFIX="$LAYER_PREFIX" LAYER_VERSION="$LAYER_VERSION"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}
          LAYER_VERSION: ${{ inputs.version }}
          DOCKER_TARGET: ${{ inputs.publish_images && 'docker-node' || '' }}

  deploy-java:
    name: Build and Publish Java
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      # For tools/layers, which publishes the layer.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        if: inputs.publish_images
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: inputs.publish_images
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Java layer and Docker image
        run: make java $DOCKER_TARGET LAYER_NAME_PREFIX="$LAYER_PREFIX" ECR_REPO_PREFIX="$LAYER_PREFIX" LAYER_VERSION="$LAYER_VERSION"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}
          LAYER_VERSION: ${{ inputs.version }}
          DOCKER_TARGET: ${{ inputs.publish_images && 'docker-java' || '' }}

  deploy-manual:
    name: Build and Publish Manual
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      # For tools/layers, which publishes the layer.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/dash0_x86_64 build/dash0_aarch64 && touch build/dash0_x86_64 build/dash0_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Build and publish Manual layer
        run: make manual LAYER_NAME_PREFIX="$LAYER_PREFIX" LAYER_VERSION="$LAYER_VERSION"
        env:
          LAYER_PREFIX: ${{ inputs.prefix }}
          LAYER_VERSION: ${{ inputs.version }}
