name: Publish Layers

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      prefix:
        required: false
        type: string
        default: ''
      region:
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy-python:
    name: Build and Publish Python
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Python layer and Docker image
        run: make python docker-python LAYER_NAME_PREFIX=${{ inputs.prefix }} ECR_REPO_PREFIX=${{ inputs.prefix }}

  deploy-node:
    name: Build and Publish Node.js
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Node.js layer and Docker image
        run: make node docker-node LAYER_NAME_PREFIX=${{ inputs.prefix }} ECR_REPO_PREFIX=${{ inputs.prefix }}

  deploy-java:
    name: Build and Publish Java
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Java layer and Docker image
        run: make java docker-java LAYER_NAME_PREFIX=${{ inputs.prefix }} ECR_REPO_PREFIX=${{ inputs.prefix }}

  deploy-manual:
    name: Build and Publish Manual
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || vars.AWS_REGION }}
      - name: Build and publish Manual layer
        run: make manual LAYER_NAME_PREFIX=${{ inputs.prefix }}
