name: Build and Publish Layers

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      prefix:
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust:
    name: Build Rust Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build binaries
        run: make build/lrap_x86_64 build/lrap_aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            build/lrap_x86_64
            build/lrap_aarch64

  deploy-python:
    name: Build and Publish Python
    needs: build-rust
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::175948133317:role/GitHubActionsDeployRole
          aws-region: ${{ vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Python layer and Docker image
        run: make python docker-python LAYER_NAME_PREFIX=${{ inputs.prefix }} ECR_REPO_PREFIX=${{ inputs.prefix }}

  deploy-node:
    name: Build and Publish Node.js
    needs: build-rust
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::175948133317:role/GitHubActionsDeployRole
          aws-region: ${{ vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Node.js layer and Docker image
        run: make node docker-node LAYER_NAME_PREFIX=${{ inputs.prefix }} ECR_REPO_PREFIX=${{ inputs.prefix }}

  deploy-java:
    name: Build and Publish Java
    needs: build-rust
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::175948133317:role/GitHubActionsDeployRole
          aws-region: ${{ vars.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Java layer and Docker image
        run: make java docker-java LAYER_NAME_PREFIX=${{ inputs.prefix }} ECR_REPO_PREFIX=${{ inputs.prefix }}

  deploy-manual:
    name: Build and Publish Manual
    needs: build-rust
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: build
      - name: Ensure binaries are executable and fresh
        run: chmod +x build/lrap_x86_64 build/lrap_aarch64 && touch build/lrap_x86_64 build/lrap_aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::175948133317:role/GitHubActionsDeployRole
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and publish Manual layer
        run: make manual LAYER_NAME_PREFIX=${{ inputs.prefix }}
