name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Layer version to release. `auto` releases the version after the highest one in any region; the current highest re-releases it, skipping the layers already out.
        required: true
        default: auto

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # The regions the layers are published to, from regions.txt.
  regions:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.regions.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - name: Read regions.txt
        id: regions
        run: echo "regions=$(jq -cR 'select(length > 0)' regions.txt | jq -cs .)" >> "$GITHUB_OUTPUT"

  deploy-dev:
    if: github.event_name == 'push'
    needs: [build, regions]
    strategy:
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.regions) }}
    uses: ./.github/workflows/publish.yml
    with:
      environment: dev-integration
      region: ${{ matrix.region }}
      publish_images: false
    secrets: inherit

  # Runs on every merge so a broken public push shows up before a release.
  publish-images-dev:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/publish-images.yml
    with:
      environment: dev-integration
    secrets: inherit

  # Settles the release version before any region publishes, so every region
  # publishes the same one. deploy-prod pads the version counters up to it.
  resolve-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod-integration
    outputs:
      version: ${{ steps.version.outputs.version }}
      node_version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.version }}
      java_version: ${{ steps.version.outputs.version }}
      manual_version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Resolve the release version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          mapfile -t regions < <(grep . regions.txt)
          version=$(tools/resolve-layer-version.sh "$REQUESTED" "${regions[@]}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, regions, resolve-version]
    strategy:
      # A failed region must not cancel the others partway through a publish.
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.regions) }}
    uses: ./.github/workflows/publish.yml
    with:
      environment: prod-integration
      region: ${{ matrix.region }}
      publish_images: false
      version: ${{ needs.resolve-version.outputs.version }}
    secrets: inherit

  # After publish-images, so the image check runs against this release's
  # `latest` and not the previous one.
  sanity-checks:
    if: github.event_name == 'workflow_dispatch'
    needs: [deploy-prod, publish-images]
    uses: ./.github/workflows/sanity-checks.yml
    secrets: inherit

  verify-layer-versions:
    if: github.event_name == 'workflow_dispatch'
    needs: [regions, resolve-version, deploy-prod]
    runs-on: ubuntu-latest
    environment: prod-integration
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Check every layer is at the release version in every region
        env:
          REGIONS: ${{ join(fromJSON(needs.regions.outputs.regions), ' ') }}
          EXPECTED: ${{ needs.resolve-version.outputs.version }}
        run: |
          # The release tag must equal the layer version in every region. If one
          # drifted, fail loudly; dispatching the same version again repairs it.
          drifted=0
          for region in $REGIONS; do
            for layer in python node java manual; do
              version=$(aws lambda list-layer-versions --region "$region" \
                --layer-name "dash0-extension-${layer}" --max-items 1 \
                --query 'LayerVersions[0].Version' --output text | head -1)
              if [ "$version" != "$EXPECTED" ]; then
                echo "error: ${region} dash0-extension-${layer} is at version ${version}, expected ${EXPECTED}" >&2
                drifted=1
              fi
            done
          done
          if [ "$drifted" -ne 0 ]; then
            echo "error: layer versions have drifted; refusing to tag" >&2
            exit 1
          fi

  # After deploy-prod, so a partial layer rollout never moves the public
  # `latest` tag, and after resolve-version, so the images carry the layer version.
  publish-images:
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-version, verify-layer-versions]
    uses: ./.github/workflows/publish-images.yml
    with:
      environment: prod-integration
      tags: ${{ needs.resolve-version.outputs.tag }} latest
    secrets: inherit

  # Waits for publish-images so a release never exists without its images. If the
  # image push fails, re-run the failed jobs: the layers are already published.
  create-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-version, publish-images]
    runs-on: ubuntu-latest
    environment: prod-integration
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          PYTHON: ${{ needs.resolve-version.outputs.python_version }}
          NODE: ${{ needs.resolve-version.outputs.node_version }}
          JAVA: ${{ needs.resolve-version.outputs.java_version }}
          MANUAL: ${{ needs.resolve-version.outputs.manual_version }}
          IMAGE_REGISTRY: public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}
        run: |
          cat <<EOF > /tmp/release-notes.md
          ## Layer ARNs

          **Python:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-python:${PYTHON}\`

          **Node:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-node:${NODE}\`

          **Java:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-java:${JAVA}\`

          **Manual:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-manual:${MANUAL}\`

          ## Container images

          **Python:**
          \`${IMAGE_REGISTRY}/extension-python:${TAG}\`

          **Node:**
          \`${IMAGE_REGISTRY}/extension-node:${TAG}\`

          **Java:**
          \`${IMAGE_REGISTRY}/extension-java:${TAG}\`
          EOF

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning::Release ${TAG} already exists; leaving it as is"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --generate-notes

  # Keep the sls-plugin's bundled "latest" versions in sync with what was just published.
  # Runs as its own job so a failure here never fails the release, and can be re-run on its
  # own (the release/tag already exists, so re-running create-release is not an option).
  # Opens a PR (rather than pushing to master) so the change is reviewed before it ships.
  sync-plugin-versions:
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-version, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync bundled versions.json, bump plugin version, and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ needs.resolve-version.outputs.node_version }}
          PYTHON: ${{ needs.resolve-version.outputs.python_version }}
          JAVA: ${{ needs.resolve-version.outputs.java_version }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          # Merge onto the existing file so keys we don't manage here (e.g.
          # dash0-extension-manual or a future runtime) are preserved rather than dropped.
          tmp=$(mktemp)
          jq --argjson node "$NODE" --argjson python "$PYTHON" --argjson java "$JAVA" '
            .["dash0-extension-node"]   = $node
            | .["dash0-extension-python"] = $python
            | .["dash0-extension-java"]   = $java
          ' sls-plugin/src/versions.json > "$tmp" && mv "$tmp" sls-plugin/src/versions.json

          if git diff --quiet -- sls-plugin/src/versions.json; then
            echo "versions.json already current; nothing to do."
            exit 0
          fi

          # dist/versions.json is baked in at build time, so consumers on
          # layerVersion: latest only see new numbers after a republish. Bump the
          # patch version here so merging this PR triggers Publish SLS Plugin.
          # --no-git-tag-version is dirty-tree safe and updates the lockfile too.
          ( cd sls-plugin && npm version patch --no-git-tag-version )
          new_plugin_version=$(jq -r .version sls-plugin/package.json)

          branch="chore/sync-layer-versions-${TAG}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::warning::Branch ${branch} already exists; not opening another sync PR"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sls-plugin/src/versions.json sls-plugin/package.json sls-plugin/package-lock.json
          git commit -m "chore: sync 'latest' layer versions to ${TAG}, bump plugin to v${new_plugin_version}"
          git push origin "$branch"
          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore: sync 'latest' layer versions to ${TAG} (plugin v${new_plugin_version})" \
            --body "Automated after ${TAG}: syncs \`sls-plugin/src/versions.json\` to node=${NODE}, python=${PYTHON}, java=${JAVA} and bumps the plugin to v${new_plugin_version}. Merging republishes \`@dash0/serverless-dash0\` to npm so consumers on \`layerVersion: latest\` resolve the new versions."
