name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy-dev:
    if: github.event_name == 'push'
    needs: build
    strategy:
      matrix:
        region: [us-east-1, us-east-2, us-west-1, us-west-2, ap-south-1, ap-northeast-1, ap-northeast-2, ap-northeast-3, ap-southeast-1, ap-southeast-2, ca-central-1, eu-central-1, eu-west-1, eu-west-2, eu-west-3, eu-north-1, il-central-1, sa-east-1]
    uses: ./.github/workflows/publish.yml
    with:
      environment: dev-integration
      region: ${{ matrix.region }}
    secrets: inherit

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      matrix:
        region: [us-east-1, us-east-2, us-west-1, us-west-2, ap-south-1, ap-northeast-1, ap-northeast-2, ap-northeast-3, ap-southeast-1, ap-southeast-2, ca-central-1, eu-central-1, eu-west-1, eu-west-2, eu-west-3, eu-north-1, il-central-1, sa-east-1]
    uses: ./.github/workflows/publish.yml
    with:
      environment: prod-integration
      region: ${{ matrix.region }}
    secrets: inherit

  sanity-checks:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy-prod
    uses: ./.github/workflows/sanity-checks.yml
    secrets: inherit

  create-release:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy-prod
    runs-on: ubuntu-latest
    environment: prod-integration
    outputs:
      node_version: ${{ steps.layers.outputs.node_version }}
      python_version: ${{ steps.layers.outputs.python_version }}
      java_version: ${{ steps.layers.outputs.java_version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Get layer versions
        id: layers
        run: |
          for layer in python node java manual; do
            version=$(aws lambda list-layer-versions \
              --layer-name "dash0-extension-${layer}" \
              --query 'LayerVersions[0].Version' \
              --output text)
            echo "${layer}_version=${version}" >> "$GITHUB_OUTPUT"
          done

      - name: Determine tag from layer version
        id: tag
        run: |
          PYTHON="${{ steps.layers.outputs.python_version }}"
          NODE="${{ steps.layers.outputs.node_version }}"
          JAVA="${{ steps.layers.outputs.java_version }}"
          MANUAL="${{ steps.layers.outputs.manual_version }}"

          # The release tag must equal the published layer version. That only has
          # a single meaning when all four layers are aligned; if they have
          # drifted, fail loudly instead of silently picking one.
          if [ "$PYTHON" != "$NODE" ] || [ "$PYTHON" != "$JAVA" ] || [ "$PYTHON" != "$MANUAL" ]; then
            echo "error: layer versions have drifted (python=$PYTHON node=$NODE java=$JAVA manual=$MANUAL); refusing to tag" >&2
            exit 1
          fi

          echo "tag=v${PYTHON}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHON="${{ steps.layers.outputs.python_version }}"
          NODE="${{ steps.layers.outputs.node_version }}"
          JAVA="${{ steps.layers.outputs.java_version }}"
          MANUAL="${{ steps.layers.outputs.manual_version }}"

          cat <<EOF > /tmp/release-notes.md
          ## Layer ARNs

          **Python:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-python:${PYTHON}\`

          **Node:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-node:${NODE}\`

          **Java:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-java:${JAVA}\`

          **Manual:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-manual:${MANUAL}\`
          EOF

          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes

  # Keep the sls-plugin's bundled "latest" versions in sync with what was just published.
  # Runs as its own job so a failure here never fails the release, and can be re-run on its
  # own (the release/tag already exists, so re-running create-release is not an option).
  # Opens a PR (rather than pushing to master) so the change is reviewed before it ships.
  sync-plugin-versions:
    if: github.event_name == 'workflow_dispatch'
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync bundled versions.json, bump plugin version, and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ needs.create-release.outputs.node_version }}
          PYTHON: ${{ needs.create-release.outputs.python_version }}
          JAVA: ${{ needs.create-release.outputs.java_version }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # Merge onto the existing file so keys we don't manage here (e.g.
          # dash0-extension-manual or a future runtime) are preserved rather than dropped.
          tmp=$(mktemp)
          jq --argjson node "$NODE" --argjson python "$PYTHON" --argjson java "$JAVA" '
            .["dash0-extension-node"]   = $node
            | .["dash0-extension-python"] = $python
            | .["dash0-extension-java"]   = $java
          ' sls-plugin/src/versions.json > "$tmp" && mv "$tmp" sls-plugin/src/versions.json

          if git diff --quiet -- sls-plugin/src/versions.json; then
            echo "versions.json already current; nothing to do."
            exit 0
          fi

          # dist/versions.json is baked in at build time, so consumers on
          # layerVersion: latest only see new numbers after a republish. Bump the
          # patch version here so merging this PR triggers Publish SLS Plugin.
          # --no-git-tag-version is dirty-tree safe and updates the lockfile too.
          ( cd sls-plugin && npm version patch --no-git-tag-version )
          new_plugin_version=$(jq -r .version sls-plugin/package.json)

          branch="chore/sync-layer-versions-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sls-plugin/src/versions.json sls-plugin/package.json sls-plugin/package-lock.json
          git commit -m "chore: sync 'latest' layer versions to ${TAG}, bump plugin to v${new_plugin_version}"
          git push origin "$branch"
          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore: sync 'latest' layer versions to ${TAG} (plugin v${new_plugin_version})" \
            --body "Automated after ${TAG}: syncs \`sls-plugin/src/versions.json\` to node=${NODE}, python=${PYTHON}, java=${JAVA} and bumps the plugin to v${new_plugin_version}. Merging republishes \`@dash0/serverless-dash0\` to npm so consumers on \`layerVersion: latest\` resolve the new versions."
