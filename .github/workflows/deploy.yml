name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy-dev:
    if: github.event_name == 'push'
    needs: build
    strategy:
      matrix:
        region: [us-east-1, us-east-2, us-west-1, us-west-2, ap-south-1, ap-northeast-1, ap-northeast-2, ap-northeast-3, ap-southeast-1, ap-southeast-2, ca-central-1, eu-central-1, eu-west-1, eu-west-2, eu-west-3, eu-north-1, il-central-1, sa-east-1]
    uses: ./.github/workflows/publish.yml
    with:
      environment: dev-integration
      region: ${{ matrix.region }}
    secrets: inherit

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      matrix:
        region: [us-east-1, us-east-2, us-west-1, us-west-2, ap-south-1, ap-northeast-1, ap-northeast-2, ap-northeast-3, ap-southeast-1, ap-southeast-2, ca-central-1, eu-central-1, eu-west-1, eu-west-2, eu-west-3, eu-north-1, il-central-1, sa-east-1]
    uses: ./.github/workflows/publish.yml
    with:
      environment: prod-integration
      region: ${{ matrix.region }}
    secrets: inherit

  sanity-checks:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy-prod
    uses: ./.github/workflows/sanity-checks.yml
    secrets: inherit

  create-release:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy-prod
    runs-on: ubuntu-latest
    environment: prod-integration
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Get layer versions
        id: layers
        run: |
          for layer in python node java manual; do
            version=$(aws lambda list-layer-versions \
              --layer-name "dash0-extension-${layer}" \
              --query 'LayerVersions[0].Version' \
              --output text)
            echo "${layer}_version=${version}" >> "$GITHUB_OUTPUT"
          done

      - name: Determine tag from layer version
        id: tag
        run: |
          PYTHON="${{ steps.layers.outputs.python_version }}"
          NODE="${{ steps.layers.outputs.node_version }}"
          JAVA="${{ steps.layers.outputs.java_version }}"
          MANUAL="${{ steps.layers.outputs.manual_version }}"

          # The release tag must equal the published layer version. That only has
          # a single meaning when all four layers are aligned; if they have
          # drifted, fail loudly instead of silently picking one.
          if [ "$PYTHON" != "$NODE" ] || [ "$PYTHON" != "$JAVA" ] || [ "$PYTHON" != "$MANUAL" ]; then
            echo "error: layer versions have drifted (python=$PYTHON node=$NODE java=$JAVA manual=$MANUAL); refusing to tag" >&2
            exit 1
          fi

          echo "tag=v${PYTHON}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHON="${{ steps.layers.outputs.python_version }}"
          NODE="${{ steps.layers.outputs.node_version }}"
          JAVA="${{ steps.layers.outputs.java_version }}"
          MANUAL="${{ steps.layers.outputs.manual_version }}"

          cat <<EOF > /tmp/release-notes.md
          ## Layer ARNs

          **Python:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-python:${PYTHON}\`

          **Node:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-node:${NODE}\`

          **Java:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-java:${JAVA}\`

          **Manual:**
          \`arn:aws:lambda:<region>:115813213817:layer:dash0-extension-manual:${MANUAL}\`
          EOF

          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes
