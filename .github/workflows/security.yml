name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-rust:
    name: Scan Rust (extension binary)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools and cargo-auditable
        run: |
          sudo apt-get install -y musl-tools
          cargo install cargo-auditable
      - name: Build shipped binary with auditable metadata
        run: cargo auditable build --release --target x86_64-unknown-linux-musl
      - name: Scan with Grype
        id: scan
        uses: anchore/scan-action@v6
        with:
          path: target/x86_64-unknown-linux-musl/release/aws-lambda-runtime-api-proxy-rs
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: rust
      - name: Annotate findings
        if: always()
        run: |
          grype --output json --file grype.json \
            target/x86_64-unknown-linux-musl/release/aws-lambda-runtime-api-proxy-rs || true
          .github/scripts/grype-annotate.sh grype.json "Rust (extension binary)"

  scan-python:
    name: Scan Python distro (installed packages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Python deps image and extract installed packages
        run: |
          docker build -t dash0-python-deps -f opt/python/Dockerfile .
          cid=$(docker create dash0-python-deps)
          docker cp "$cid":/asset-output/python build/python
          docker rm "$cid"
      - name: Scan installed packages with Grype
        id: scan
        uses: anchore/scan-action@v6
        with:
          path: build/python
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: python
      - name: Annotate findings
        if: always()
        run: |
          grype --output json --file grype.json build/python || true
          .github/scripts/grype-annotate.sh grype.json "Python distro"

  scan-node:
    name: Scan Node.js distro (shipped modules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build AWS SDK tarball
        run: bash opt/node/scripts/build-aws-sdk-tarball.sh
      - name: Install dependencies and build bundle
        working-directory: opt/node
        run: npm install && npm run build
      - name: Assemble shipped node_modules (mirrors Makefile)
        run: |
          mkdir -p build/stage-node/node_modules
          for pkg in \
            require-in-the-middle \
            import-in-the-middle \
            module-details-from-path \
            debug \
            ms \
            acorn \
            cjs-module-lexer; do
            cp -r "opt/node/node_modules/$pkg" build/stage-node/node_modules/
          done
          # acorn-import-attributes is optional
          cp -r opt/node/node_modules/acorn-import-attributes build/stage-node/node_modules/ 2>/dev/null || true
          cp opt/node/dist/init.mjs build/stage-node/
      - name: Scan shipped modules with Grype
        id: scan
        uses: anchore/scan-action@v6
        with:
          path: build/stage-node
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: node
      - name: Annotate findings
        if: always()
        run: |
          grype --output json --file grype.json build/stage-node || true
          .github/scripts/grype-annotate.sh grype.json "Node.js distro"

  scan-java:
    name: Scan Java distro (assembled JAR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java distro JAR
        working-directory: opt/java/opentelemetry-java-distro
        run: ./gradlew clean -Pversion=1.0.0-SNAPSHOT assemble -x javadoc
      - name: Scan assembled JAR with Grype
        id: scan
        uses: anchore/scan-action@v6
        with:
          path: opt/java/opentelemetry-java-distro/agent/build/libs
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: java
      - name: Annotate findings
        if: always()
        run: |
          grype --output json --file grype.json \
            opt/java/opentelemetry-java-distro/agent/build/libs || true
          .github/scripts/grype-annotate.sh grype.json "Java distro"
