name: Benchmark

on:
  workflow_dispatch:
    inputs:
      cold_start_invocations:
        description: 'Number of cold start invocations per function'
        required: false
        default: '10'
      commit_results:
        description: 'Commit results to the repo'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

env:
  RESOURCE_PREFIX: bench-
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Rust Binaries
    uses: ./.github/workflows/build.yml

  publish-layers:
    name: Publish Layers
    needs: build
    uses: ./.github/workflows/publish.yml
    with:
      environment: staging
      prefix: bench-
    secrets: inherit

  benchmark:
    name: Run Benchmark
    needs: publish-layers
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            benchmarks/iac/package-lock.json
            benchmarks/scripts/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: benchmarks/iac
        run: npm ci

      - name: Deploy benchmark stack
        working-directory: benchmarks/iac
        run: npx cdk deploy --require-approval never
        env:
          DASH0_DEV_API_TOKEN: ${{ secrets.DASH0_DEV_API_TOKEN }}
          RESOURCE_PREFIX: ${{ env.RESOURCE_PREFIX }}

      - name: Install benchmark script dependencies
        working-directory: benchmarks/scripts
        run: npm ci

      - name: Run benchmark
        working-directory: benchmarks/scripts
        run: npx tsx run-benchmark.ts
        env:
          RESOURCE_PREFIX: ${{ env.RESOURCE_PREFIX }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          COLD_START_INVOCATIONS: ${{ inputs.cold_start_invocations }}

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json

      - name: Destroy benchmark stack
        if: always()
        working-directory: benchmarks/iac
        run: npx cdk destroy --force
        env:
          DASH0_DEV_API_TOKEN: ${{ secrets.DASH0_DEV_API_TOKEN }}
          RESOURCE_PREFIX: ${{ env.RESOURCE_PREFIX }}

      - name: Commit results
        if: inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/
          git commit -m "benchmark: update results $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
